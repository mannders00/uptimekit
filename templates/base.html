{% load static %}
<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>UptimeKit · Infrastructure ownership</title>
  <link rel="stylesheet" href="{% static 'core/site.css' %}">
</head>
<body>
  <header>
    <a class="brand" href="{% url 'dashboard' %}"><span aria-hidden="true">◉</span> UptimeKit</a>
    <nav aria-label="Main navigation">
      <a href="/">Monitors</a>
      <a href="{% url 'operations' %}">Live infrastructure</a>
      {% if user.is_authenticated %}
        <form class="inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Log out</button></form>
      {% else %}
        <a href="{% url 'login' %}">Log in</a>
        <a href="{% url 'signup' %}">Register</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer><small>Reference infrastructure · <a href="https://github.com/mannders00/uptimekit">Source, workflows & runbooks</a></small></footer>
</body>
</html>
