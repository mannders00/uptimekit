<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>UptimeKit · Infrastructure ownership</title>
<style>body{margin:0;background:#101923;color:#dce7f1;font:16px/1.6 system-ui}header,main,footer{max-width:1100px;margin:auto;padding:24px}header{display:flex;gap:24px;align-items:center;border-bottom:1px solid #344554}a{color:#74d4ba}h1,h2{line-height:1.2}h1{font-size:38px}small,.muted{color:#a2b3c5}.card{background:#192735;border:1px solid #344554;border-radius:12px;padding:24px;margin:20px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #344554}input,select,button{font:inherit;padding:10px;border-radius:5px}input,select{max-width:90%}button{background:#74d4ba;border:0;color:#101923;cursor:pointer}label{display:block}form.inline{display:inline}form.inline button{padding:4px 12px}.ok{color:#74d4ba}.bad{color:#ffac93}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}.errorlist{color:#ffac93}iframe{width:100%;height:680px;border:1px solid #344554;border-radius:12px}</style></head>
<body><header><strong>◉ UptimeKit</strong><a href="/">Monitors</a><a href="/infrastructure/">Live infrastructure</a>{% if user.is_authenticated %}<form class="inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Log out</button></form>{% else %}<a href="{% url 'login' %}">Log in</a><a href="{% url 'signup' %}">Register</a>{% endif %}</header><main>{% block content %}{% endblock %}</main><footer><small>Reference infrastructure · <a href="https://github.com/mannders00/uptimekit">Source, workflows & runbooks</a></small></footer></body></html>
