services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: uptimekit
      POSTGRES_USER: uptimekit
      POSTGRES_PASSWORD: uptimekit
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  postgres_data:
