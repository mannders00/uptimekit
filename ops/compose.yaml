name: uptimekit-ops
x-default: &default
  restart: unless-stopped
  logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
services:
  caddy:
    <<: *default
    env_file: /etc/uptimekit/reticle.env
    image: caddy:2.10.2-alpine
    mem_limit: 160m
    ports: ['80:80', '443:443', '443:443/udp', '127.0.0.1:8443:8443', '127.0.0.1:8444:8444']
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-uptimekit.masoftware.net}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts: ['host.docker.internal:host-gateway']
    networks: [ops]
  prometheus:
    <<: *default
    image: prom/prometheus:v3.5.1
    mem_limit: 320m
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=15d', '--storage.tsdb.retention.size=2GB']
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./alerts-offhost.yml:/etc/prometheus/alerts-offhost.yml:ro
      - /etc/uptimekit/metrics-token:/etc/prometheus/metrics-token:ro
      - prometheus_data:/prometheus
    networks: [ops]
  alertmanager:
    <<: *default
    image: prom/alertmanager:v0.28.1
    mem_limit: 64m
    ports: ['127.0.0.1:9093:9093']
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [ops]
  grafana:
    <<: *default
    image: grafana/grafana:12.3.3
    mem_limit: 256m
    ports: ['127.0.0.1:3000:3000']
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - /etc/uptimekit/grafana-password:/run/secrets/grafana-password:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [ops]
  node-exporter:
    <<: *default
    image: prom/node-exporter:v1.9.1
    mem_limit: 48m
    command: ['--path.rootfs=/host', '--collector.textfile.directory=/textfile']
    volumes:
      - /:/host:ro,rslave
      - /var/lib/uptimekit/metrics:/textfile:ro
    networks: [ops]
  blackbox:
    <<: *default
    image: prom/blackbox-exporter:v0.27.0
    mem_limit: 48m
    volumes: ['./blackbox.yml:/etc/blackbox_exporter/config.yml:ro']
    networks: [ops]
networks:
  ops: {external: true, name: uptimekit-ops}
volumes:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
  grafana_data:
