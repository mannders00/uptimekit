# Destination ACLs are evaluated by Squid against resolved connection addresses.
# Redirects are disabled in the application; CONNECT is limited to HTTPS.
http_port 3128
acl private_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl private_dst dst ::/128 ::1/128 64:ff9b::/96 100::/64 2001:db8::/32 fc00::/7 fe80::/10 ff00::/8
acl safe_ports port 80 443
acl ssl_ports port 443
acl CONNECT method CONNECT
http_access deny !safe_ports
http_access deny CONNECT !ssl_ports
http_access deny private_dst
http_access allow all
cache deny all
# Avoid logging customer destinations; application logs contain bounded IDs.
access_log none
cache_log /dev/stderr
cache_store_log none
pid_filename /tmp/squid.pid
coredump_dir /tmp
shutdown_lifetime 1 seconds
max_filedescriptors 1024
cache_mem 16 MB
