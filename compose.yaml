name: uptimekit-${ENVIRONMENT:-dev}
x-app: &app
  image: ${APP_IMAGE:?Set an immutable APP_IMAGE digest}
  env_file: ${APP_ENV_FILE:-.env}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  volumes: [media:/app/media]
  networks: [data, egress]
services:
  web:
    <<: *app
    mem_limit: 320m
    ports: ["127.0.0.1:${WEB_PORT:-8001}:8000"]
    networks:
      data:
      egress:
      ops:
        aliases: ["${ENVIRONMENT:-dev}-web"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    <<: *app
    command: celery -A config worker -l INFO --concurrency=1 --max-tasks-per-child=500
    mem_limit: 384m
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  beat:
    <<: *app
    command: celery -A config beat -l INFO --schedule=/tmp/celerybeat-schedule
    mem_limit: 160m
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  db:
    image: postgres:17.9-bookworm
    restart: unless-stopped
    mem_limit: 320m
    environment:
      POSTGRES_DB: uptimekit
      POSTGRES_USER: uptimekit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U uptimekit -d uptimekit]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  redis:
    image: redis:7.4.8-alpine
    restart: unless-stopped
    mem_limit: 96m
    command: redis-server --maxmemory 64mb --maxmemory-policy noeviction --save "" --appendonly no
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  check-proxy:
    image: ubuntu/squid@sha256:eecf35336788c1ab143566bca99ac58f213e9f17906a9a684346d7b323b6696c
    restart: unless-stopped
    mem_limit: 128m
    ulimits:
      nofile: {soft: 1024, hard: 1024}
    tmpfs: [/tmp]
    volumes: [./ops/squid.conf:/etc/squid/squid.conf:ro]
    networks: [data, egress]
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
networks:
  data: {internal: true}
  egress:
  ops: {external: true, name: uptimekit-ops}
volumes:
  postgres_data:
  media:
