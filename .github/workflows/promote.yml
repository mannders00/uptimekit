name: Promote verified image to production
on:
  workflow_dispatch:
    inputs:
      image:
        description: Exact ghcr.io/mannders00/uptimekit@sha256 digest verified in dev
        required: true
        type: string
permissions: {contents: read}
concurrency:
  group: production-operation
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Promote over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          APP_IMAGE: ${{ inputs.image }}
        run: bash scripts/remote.sh prod deploy "$APP_IMAGE"
      - name: Public TLS and release check
        run: curl --fail --retry 6 --retry-delay 10 https://uptimekit.masoftware.net/health/ready
